<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OwnIt — Customers</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar">
    <div class="brand">OWNIT<span>.</span></div>

    <nav>
        <a href="index.html">Dashboard</a>
        <a href="orders.html">Orders</a>
        <a href="customers.html" class="active">Customers</a>
        <a href="products.html">Products</a>
        <a href="reviews.html">Reviews</a>
        <a href="assistant.html">Assistant</a>
    </nav>
</div>

<main class="main">

    <header class="topbar">
        <div>
            <p class="eyebrow">COMMERCE</p>
            <h1>Customers</h1>
        </div>

        <div class="status">
            <span></span> Backend connected
        </div>
    </header>

    <section class="panel">

        <div class="panel-header">
            <p class="eyebrow">CUSTOMER LIST</p>
            <h2>All Customers</h2>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Orders</th>
                        <th>Total Spent</th>
                    </tr>
                </thead>

                <tbody id="customersTable">
                    <tr>
                        <td colspan="5">Loading customers...</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </section>

</main>

<script src="auth.js"></script>
<script src="customers.js"></script>
</body>
</html>
