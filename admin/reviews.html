<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OwnIt — Reviews</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar">
    <div class="brand">OWNIT<span>.</span></div>
    <nav>
        <a href="index.html">Dashboard</a>
        <a href="orders.html">Orders</a>
        <a href="customers.html">Customers</a>
        <a href="products.html">Products</a>
        <a href="reviews.html" class="active">Reviews</a>
        <a href="assistant.html">Assistant</a>
    </nav>
</div>

<main class="main">
    <header class="topbar">
        <div>
            <p class="eyebrow">COMMERCE</p>
            <h1>Reviews</h1>
        </div>
        <div class="status"><span></span> Backend connected</div>
    </header>

    <section class="panel">
        <div class="panel-header">
            <p class="eyebrow">MODERATION</p>
            <h2>All Reviews</h2>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Author</th>
                        <th>Rating</th>
                        <th>Review</th>
                        <th>Status</th>
                        <th>Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="reviewsTable">
                    <tr><td colspan="7">Loading reviews...</td></tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<script src="auth.js"></script>
<script src="reviews.js"></script>
</body>
</html>
